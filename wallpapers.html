<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallpapers | Shonen Horizon</title>
    <meta
      name="description"
      content="Wallpapers Shonen Horizon - mockup visual estatico de colecao premium."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="Navegacao principal">
        <a class="brand" href="index.html" aria-label="Shonen Horizon - Home">
          <span class="brand-name">Shonen Horizon</span>
        </a>

        <nav class="main-nav" aria-label="Menu">
          <!-- Área futura: novos itens de menu podem entrar aqui. -->
          <a class="nav-link" href="index.html" data-page="home">Home</a>
          <a class="nav-link" href="wallpapers.html" data-page="wallpapers">Wallpapers</a>
          <a class="nav-link" href="sobre.html" data-page="sobre">Sobre</a>
        </nav>
      </header>

      <main>
        <section class="wallpapers-section page-section" id="wallpapers">
          <div class="section-heading">
            <p class="eyebrow">Colecao inicial</p>
            <h1>Wallpapers</h1>
            <p class="section-copy">
              Uma primeira vitrine visual para testar ritmo, grid e atmosfera da
              marca antes dos downloads reais.
            </p>
          </div>

          <div class="wallpaper-grid" aria-label="Wallpapers em destaque">
            <article class="wallpaper-card">
              <div class="wallpaper-preview preview-aurora">
                <span>01</span>
              </div>
              <div class="card-content">
                <h2>Neon Dawn</h2>
                <button type="button">Download</button>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview preview-crimson">
                <span>02</span>
              </div>
              <div class="card-content">
                <h2>Crimson Sky</h2>
                <button type="button">Download</button>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview preview-moon">
                <span>03</span>
              </div>
              <div class="card-content">
                <h2>Moon Arc</h2>
                <button type="button">Download</button>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview preview-ember">
                <span>04</span>
              </div>
              <div class="card-content">
                <h2>Silent Ember</h2>
                <button type="button">Download</button>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview preview-horizon">
                <span>05</span>
              </div>
              <div class="card-content">
                <h2>Horizon Drift</h2>
                <button type="button">Download</button>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview preview-void">
                <span>06</span>
              </div>
              <div class="card-content">
                <h2>Void Pulse</h2>
                <button type="button">Download</button>
              </div>
            </article>
          </div>

          <!-- Placeholder: cards usam gradientes ate existirem imagens em assets/images. -->
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
