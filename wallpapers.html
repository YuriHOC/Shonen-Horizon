<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallpapers | Shonen Horizon</title>
    <meta
      name="description"
      content="Wallpapers Shonen Horizon - mockup visual estatico de colecao premium."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="Navegacao principal">
        <a class="brand" href="index.html" aria-label="Shonen Horizon - Home">
          <span class="brand-name">Shonen Horizon</span>
        </a>

        <nav class="main-nav" aria-label="Menu">
          <!-- Área futura: novos itens de menu podem entrar aqui. -->
          <a class="nav-link" href="index.html" data-page="home">Home</a>
          <a class="nav-link" href="wallpapers.html" data-page="wallpapers">Wallpapers</a>
          <a class="nav-link" href="sobre.html" data-page="sobre">Sobre</a>
        </nav>
      </header>

      <main>
        <section class="wallpapers-section page-section" id="wallpapers">
          <div class="section-heading">
            <p class="eyebrow">Colecao inicial</p>
            <h1>Wallpapers</h1>
            <p class="section-copy">
              Uma primeira vitrine para testar colecoes, capas e energia visual
              antes dos downloads reais.
            </p>
          </div>

          <div class="wallpaper-grid" aria-label="Wallpapers em destaque">
            <article class="wallpaper-card">
              <div class="wallpaper-preview wallpaper-preview-image">
                <button
                  class="wallpaper-open-button"
                  type="button"
                  data-full-image="assets/img/wallp/NarutoAndDeku.png"
                  data-image-title="Naruto & Deku"
                  aria-label="Visualizar wallpaper Naruto & Deku"
                >
                  <img
                    class="wallpaper-image"
                    src="assets/img/wallp/NarutoAndDeku.png"
                    alt="Wallpaper Naruto and Deku"
                  />
                </button>
              </div>
              <div class="card-content">
                <h2>Naruto & Deku</h2>
                <a class="download-button" href="assets/img/wallp/NarutoAndDeku.png" download="NarutoAndDeku.png">Download</a>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview wallpaper-preview-image">
                <button
                  class="wallpaper-open-button preview-shift-left"
                  type="button"
                  data-full-image="assets/img/wallp/SasukeAndVegeta.png"
                  data-image-title="Sasuke & Vegeta"
                  aria-label="Visualizar wallpaper Sasuke & Vegeta"
                >
                  <img
                    class="wallpaper-image"
                    src="assets/img/wallp/SasukeAndVegeta.png"
                    alt="Wallpaper Sasuke and Vegeta"
                  />
                </button>
              </div>
              <div class="card-content">
                <h2>Sasuke & Vegeta</h2>
                <a class="download-button" href="assets/img/wallp/SasukeAndVegeta.png" download="SasukeAndVegeta.png">Download</a>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview wallpaper-preview-image">
                <button
                  class="wallpaper-open-button preview-shift-left"
                  type="button"
                  data-full-image="assets/img/wallp/GokuBlue.png"
                  data-image-title="Goku Blue"
                  aria-label="Visualizar wallpaper Goku Blue"
                >
                  <img
                    class="wallpaper-image"
                    src="assets/img/wallp/GokuBlue.png"
                    alt="Wallpaper Goku Blue"
                  />
                </button>
              </div>
              <div class="card-content">
                <h2>Goku Blue</h2>
                <a class="download-button" href="assets/img/wallp/GokuBlue.png" download="GokuBlue.png">Download</a>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview wallpaper-preview-image">
                <button
                  class="wallpaper-open-button preview-shift-left"
                  type="button"
                  data-full-image="assets/img/wallp/KenKaneki.png"
                  data-image-title="Ken Kaneki"
                  aria-label="Visualizar wallpaper Ken Kaneki"
                >
                  <img
                    class="wallpaper-image"
                    src="assets/img/wallp/KenKaneki.png"
                    alt="Wallpaper Ken Kaneki"
                  />
                </button>
              </div>
              <div class="card-content">
                <h2>Ken Kaneki</h2>
                <a class="download-button" href="assets/img/wallp/KenKaneki.png" download="KenKaneki.png">Download</a>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview wallpaper-preview-image">
                <button
                  class="wallpaper-open-button"
                  type="button"
                  data-full-image="assets/img/wallp/Kirito.png"
                  data-image-title="Kirito"
                  aria-label="Visualizar wallpaper Kirito"
                >
                  <img
                    class="wallpaper-image"
                    src="assets/img/wallp/Kirito.png"
                    alt="Wallpaper Kirito"
                  />
                </button>
              </div>
              <div class="card-content">
                <h2>Kirito</h2>
                <a class="download-button" href="assets/img/wallp/Kirito.png" download="Kirito.png">Download</a>
              </div>
            </article>

            <article class="wallpaper-card">
              <div class="wallpaper-preview wallpaper-preview-image">
                <button
                  class="wallpaper-open-button preview-shift-left"
                  type="button"
                  data-full-image="assets/img/wallp/SatoruGojou.png"
                  data-image-title="Satoru Gojou"
                  aria-label="Visualizar wallpaper Satoru Gojou"
                >
                  <img
                    class="wallpaper-image"
                    src="assets/img/wallp/SatoruGojou.png"
                    alt="Wallpaper Satoru Gojou"
                  />
                </button>
              </div>
              <div class="card-content">
                <h2>Satoru Gojou</h2>
                <a class="download-button" href="assets/img/wallp/SatoruGojou.png" download="SatoruGojou.png">Download</a>
              </div>
            </article>
          </div>

          <!-- Área futura: novos wallpapers podem ser adicionados seguindo este mesmo modelo. -->
        </section>
      </main>
    </div>

    <div class="image-lightbox" aria-hidden="true">
      <button class="lightbox-close" type="button" aria-label="Fechar visualizacao">Fechar</button>
      <img class="lightbox-image" src="" alt="" />
      <p class="lightbox-title"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
