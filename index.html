<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shonen Horizon</title>
    <meta
      name="description"
      content="Shonen Horizon - prototipo visual premium para wallpapers de anime."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="Navegacao principal">
        <a class="brand" href="index.html" aria-label="Shonen Horizon - Home">
          <span class="brand-name">Shonen Horizon</span>
        </a>

        <nav class="main-nav" aria-label="Menu">
          <!-- Área futura: novos itens de menu podem entrar aqui. -->
          <a class="nav-link" href="index.html" data-page="home">Home</a>
          <a class="nav-link" href="wallpapers.html" data-page="wallpapers">Wallpapers</a>
          <a class="nav-link" href="sobre.html" data-page="sobre">Sobre</a>
        </nav>
      </header>

      <main>
        <section class="hero-section section-panel" id="home">
          <div class="hero-atmosphere" aria-hidden="true"></div>
          <div class="hero-content">
            <p class="eyebrow">A Melhor Central Geek tem nome!</p>
            <div class="hero-logo-wrap" aria-label="Shonen Horizon">
              <img
                class="hero-logo"
                src="assets/img/Marca/Letreiro.png"
                alt="Shonen Horizon"
              />
            </div>
            <h1 class="sr-only">Shonen Horizon</h1>
            <p class="hero-copy">
              Um espaço para quem ama anime, estética shonen e imagens épicas,
              feito para levar as melhores notícias dos animes para vocês. Além
              de conteúdos incríveis, como nossas páginas e blog!
              <a class="inline-cta" href="sobre.html">Venha conhecer</a>
            </p>
          </div>
          <!-- Implementação futura: incluir destaque de colecao, busca ou filtros. -->
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
